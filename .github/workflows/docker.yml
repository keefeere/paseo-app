name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      export_image:
        description: "Export the standard Docker image as a downloadable archive (linux/amd64)."
        type: boolean
        default: false
      checkout_ref:
        description: "Source commit for the exported image (defaults to workflow commit)."
        required: false
        default: ""
      paseo_version:
        description: "Expected source version to build. Required when publish is true."
        required: false
        default: ""
      publish:
        description: "Publish the image to GHCR. Manual publishes require paseo_version."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_latest:
        description: "Also publish ghcr.io/getpaseo/paseo:latest. Ignored for prereleases."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.values.outputs.image }}
      install_version: ${{ steps.values.outputs.install_version }}
      publish: ${{ steps.values.outputs.publish }}
      check_tag: ${{ steps.values.outputs.check_tag }}
      publish_tags: ${{ steps.values.outputs.publish_tags }}
    steps:
      - uses: actions/checkout@v6

      - id: values
        env:
          INPUT_PASEO_VERSION: ${{ inputs.paseo_version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/paseo"
          package_version="$(node -p "require('./package.json').version")"
          install_version="${INPUT_PASEO_VERSION:-${package_version}}"
          publish=false
          publish_latest=false
          prerelease=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            install_version="${REF_NAME#v}"
            publish=true
            if [[ "${REF_NAME}" == *-* ]]; then
              prerelease=true
            else
              publish_latest=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PUBLISH:-false}" == "true" ]]; then
              if [[ -z "${INPUT_PASEO_VERSION}" || "${INPUT_PASEO_VERSION}" == "latest" ]]; then
                echo "::error::paseo_version is required for manual Docker publishes."
                exit 1
              fi
              publish=true
            fi

            if [[ "${install_version}" == *-* ]]; then
              prerelease=true
            fi

            if [[ "${INPUT_PUBLISH_LATEST:-false}" == "true" && "${prerelease}" != "true" ]]; then
              publish_latest=true
            fi
          fi

          check_tag="${image}:check-${GITHUB_SHA::12}"
          publish_tags="${image}:${install_version}"
          if [[ "${publish_latest}" == "true" ]]; then
            publish_tags="${publish_tags}"$'\n'"${image}:latest"
          fi

          {
            echo "image=${image}"
            echo "install_version=${install_version}"
            echo "publish=${publish}"
            echo "check_tag=${check_tag}"
            echo "publish_tags<<EOF"
            echo "${publish_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image=${image} install_version=${install_version} publish=${publish}"

  build:
    needs: setup
    if: needs.setup.outputs.publish != 'true' && inputs.export_image != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.check_tag }}
          push: false
          provenance: false
          cache-from: type=gha,scope=paseo
          cache-to: type=gha,scope=paseo,mode=max

      # GitHub expires cache entries 7 days after the last access, and every
      # buildx run opens a new cache `version`, so superseded version sets stack
      # up inside one billing cycle. The fork keeps only the newest version set
      # per ref, by `created_at`; access timestamps move in lockstep across a
      # run's entries and cannot rank the sets. Upstream storage is untouched.
      - name: Prune superseded buildx cache versions
        if: always() && github.repository == 'keefeere/paseo-app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.created_at, .ref, .key, .version] | @tsv' \
            > "$RUNNER_TEMP/actions-caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/actions-caches.tsv" <<'PY' > "$RUNNER_TEMP/cache-delete-endpoints.txt"
          import collections, sys, urllib.parse

          repo, path = sys.argv[1], sys.argv[2]
          groups = collections.defaultdict(list)
          for line in open(path):
              created, ref, key, version = line.rstrip("\n").split("\t")
              groups[(ref, version)].append((created, ref, key, version))
          newest = {}
          for (ref, _), rows in groups.items():
              newest[ref] = max(newest.get(ref, ""), max(row[0] for row in rows))
          for (ref, version), rows in groups.items():
              if max(row[0] for row in rows) == newest[ref]:
                  continue
              for _, _, key, version in rows:
                  query = urllib.parse.urlencode({"ref": ref, "key": key, "version": version})
                  print(f"repos/{repo}/actions/caches?{query}")
          PY
          while read -r endpoint; do
            gh api -X DELETE "$endpoint" > /dev/null
          done < "$RUNNER_TEMP/cache-delete-endpoints.txt"

  publish:
    needs: setup
    if: needs.setup.outputs.publish == 'true' && inputs.export_image != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.publish_tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=paseo
          cache-to: type=gha,scope=paseo,mode=max

      # Same storage rule as the build job.
      - name: Prune superseded buildx cache versions
        if: always() && github.repository == 'keefeere/paseo-app'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.created_at, .ref, .key, .version] | @tsv' \
            > "$RUNNER_TEMP/actions-caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/actions-caches.tsv" <<'PY' > "$RUNNER_TEMP/cache-delete-endpoints.txt"
          import collections, sys, urllib.parse

          repo, path = sys.argv[1], sys.argv[2]
          groups = collections.defaultdict(list)
          for line in open(path):
              created, ref, key, version = line.rstrip("\n").split("\t")
              groups[(ref, version)].append((created, ref, key, version))
          newest = {}
          for (ref, _), rows in groups.items():
              newest[ref] = max(newest.get(ref, ""), max(row[0] for row in rows))
          for (ref, version), rows in groups.items():
              if max(row[0] for row in rows) == newest[ref]:
                  continue
              for _, _, key, version in rows:
                  query = urllib.parse.urlencode({"ref": ref, "key": key, "version": version})
                  print(f"repos/{repo}/actions/caches?{query}")
          PY
          while read -r endpoint; do
            gh api -X DELETE "$endpoint" > /dev/null
          done < "$RUNNER_TEMP/cache-delete-endpoints.txt"

  export-image:
    needs: setup
    if: github.event_name == 'workflow_dispatch' && inputs.export_image == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          path: source
      - name: Build and export standard image
        env:
          VERSION: ${{ needs.setup.outputs.install_version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./source/package.json').version")" = "$VERSION"
          revision="$(git -C source rev-parse HEAD)"
          docker build --build-arg PASEO_VERSION="$VERSION" \
            --label "org.opencontainers.image.revision=$revision" \
            -f source/docker/base/Dockerfile -t "paseo-base:$VERSION" -t "paseo-base:sha-$revision" source
          docker run --rm --entrypoint /bin/bash "paseo-base:$VERSION" -ec '
            test "$(node -p "require(\"/usr/local/lib/node_modules/@getpaseo/server/package.json\").version")" = "$1"
            test "$(node -p "require(\"/usr/local/lib/node_modules/@getpaseo/cli/package.json\").version")" = "$1"
          ' -- "$VERSION"
          mkdir -p image-artifact
          docker save "paseo-base:$VERSION" "paseo-base:sha-$revision" | gzip -1 > "image-artifact/paseo-base-$VERSION.tar.gz"
          (cd image-artifact && sha256sum *.tar.gz > SHA256SUMS)
          # COMPAT(fork-nas-updater): the NAS updater verifies the image through
          # `docker image inspect` after `docker load`, and older Docker assigns the loaded image
          # the config blob digest. Docker 28 on the runner reports the manifest digest from
          # `image inspect .Id`, so the archive manifest is the only ID both hosts agree on.
          config_id="$(gzip -dc "image-artifact/paseo-base-$VERSION.tar.gz" | tar -xOf - manifest.json | node -e '
            const manifest = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (manifest.length !== 1) {
              console.error("expected a single image in the docker archive");
              process.exit(1);
            }
            const config = manifest[0].Config;
            const digest = config.split("/").at(-1);
            if (!/^[0-9a-f]{64}$/.test(digest)) {
              console.error(`unexpected config entry: ${config}`);
              process.exit(1);
            }
            process.stdout.write(`sha256:${digest}`);
          ')"
          {
            echo "version=$VERSION"
            echo "revision=$revision"
            echo "image=paseo-base:sha-$revision"
            echo "image_id=$config_id"
            echo "platform=linux/amd64"
          } | tee image-artifact/image-metadata.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-image
          path: image-artifact/
          compression-level: 0
          retention-days: 3
