name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      nas_image:
        description: "Build the full NAS image as a downloadable artifact."
        type: boolean
        default: false
      checkout_ref:
        description: "Source commit for the NAS image (defaults to workflow commit)."
        required: false
        default: ""
      paseo_version:
        description: "Expected source version to build. Required when publish is true."
        required: false
        default: ""
      publish:
        description: "Publish the image to GHCR. Manual publishes require paseo_version."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_latest:
        description: "Also publish ghcr.io/getpaseo/paseo:latest. Ignored for prereleases."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.values.outputs.image }}
      install_version: ${{ steps.values.outputs.install_version }}
      publish: ${{ steps.values.outputs.publish }}
      check_tag: ${{ steps.values.outputs.check_tag }}
      publish_tags: ${{ steps.values.outputs.publish_tags }}
    steps:
      - uses: actions/checkout@v6

      - id: values
        env:
          INPUT_PASEO_VERSION: ${{ inputs.paseo_version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/paseo"
          package_version="$(node -p "require('./package.json').version")"
          install_version="${INPUT_PASEO_VERSION:-${package_version}}"
          publish=false
          publish_latest=false
          prerelease=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            install_version="${REF_NAME#v}"
            publish=true
            if [[ "${REF_NAME}" == *-* ]]; then
              prerelease=true
            else
              publish_latest=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PUBLISH:-false}" == "true" ]]; then
              if [[ -z "${INPUT_PASEO_VERSION}" || "${INPUT_PASEO_VERSION}" == "latest" ]]; then
                echo "::error::paseo_version is required for manual Docker publishes."
                exit 1
              fi
              publish=true
            fi

            if [[ "${install_version}" == *-* ]]; then
              prerelease=true
            fi

            if [[ "${INPUT_PUBLISH_LATEST:-false}" == "true" && "${prerelease}" != "true" ]]; then
              publish_latest=true
            fi
          fi

          check_tag="${image}:check-${GITHUB_SHA::12}"
          publish_tags="${image}:${install_version}"
          if [[ "${publish_latest}" == "true" ]]; then
            publish_tags="${publish_tags}"$'\n'"${image}:latest"
          fi

          {
            echo "image=${image}"
            echo "install_version=${install_version}"
            echo "publish=${publish}"
            echo "check_tag=${check_tag}"
            echo "publish_tags<<EOF"
            echo "${publish_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image=${image} install_version=${install_version} publish=${publish}"

  build:
    needs: setup
    if: needs.setup.outputs.publish != 'true' && inputs.nas_image != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.check_tag }}
          push: false
          provenance: false
          cache-from: type=gha,scope=paseo
          cache-to: type=gha,scope=paseo,mode=max

  publish:
    needs: setup
    if: needs.setup.outputs.publish == 'true' && inputs.nas_image != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            PASEO_VERSION=${{ needs.setup.outputs.install_version }}
          tags: ${{ needs.setup.outputs.publish_tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=paseo
          cache-to: type=gha,scope=paseo,mode=max

  nas-image:
    needs: setup
    if: github.event_name == 'workflow_dispatch' && inputs.nas_image == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          path: source
      - name: Build full NAS image
        env:
          VERSION: ${{ needs.setup.outputs.install_version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./source/package.json').version")" = "$VERSION"
          revision="$(git -C source rev-parse HEAD)"
          docker build --build-arg PASEO_VERSION="$VERSION" \
            -f source/docker/base/Dockerfile -t "paseo-nas-base:$revision" source
          docker build --build-arg BASE_IMAGE="paseo-nas-base:$revision" \
            --label "org.opencontainers.image.revision=$revision" \
            -f docker/nas/Dockerfile -t "paseo-nas:$VERSION" -t "paseo-nas:sha-$revision" .
          docker run --rm --entrypoint /bin/bash "paseo-nas:$VERSION" -ec '
            test "$(node -p "require(\"/usr/local/lib/node_modules/@getpaseo/server/package.json\").version")" = "$1"
            test "$(node -p "require(\"/usr/local/lib/node_modules/@getpaseo/cli/package.json\").version")" = "$1"
            claude --version; codex --version; opencode --version; agy --version; pi --version; gh --version; ssh -V
          ' -- "$VERSION"
          mkdir -p nas-artifact
          docker save "paseo-nas:$VERSION" "paseo-nas:sha-$revision" | gzip -1 > "nas-artifact/paseo-nas-$VERSION.tar.gz"
          (cd nas-artifact && sha256sum *.tar.gz > SHA256SUMS)
          {
            echo "version=$VERSION"
            echo "revision=$revision"
            echo "image=paseo-nas:sha-$revision"
            echo "image_id=$(docker image inspect --format '{{.Id}}' "paseo-nas:$VERSION")"
            echo "platform=linux/amd64"
          } | tee nas-artifact/image-metadata.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-nas-image
          path: nas-artifact/
          compression-level: 0
          retention-days: 14
