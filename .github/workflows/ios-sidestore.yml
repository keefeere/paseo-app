name: Build SideStore iOS IPA

on:
  push:
    branches:
      - feat/ios-sidestore
    paths:
      - .github/workflows/ios-sidestore.yml
      - packages/app/app.config.js
      - scripts/build-ios-sidestore.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macos-paseo-ios]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure isolated build tools
        run: |
          echo "DEVELOPER_DIR=$HOME/Downloads/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          echo "LANG=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=en_US.UTF-8" >> "$GITHUB_ENV"
          echo "$HOME/paseo-ios-tools/node-v22.23.5-darwin-x64/bin" >> "$GITHUB_PATH"
          echo "$HOME/paseo-ios-tools/ruby-3.3.11/bin" >> "$GITHUB_PATH"
          echo "$HOME/local/bin" >> "$GITHUB_PATH"
      - name: Check toolchain
        run: |
          node --version
          ruby --version
          pod --version
          xcodebuild -version
          xcrun swift --version
          df -h .
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build unsigned IPA
        run: bash scripts/build-ios-sidestore.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-sidestore
          path: artifacts/ios-sidestore/
          if-no-files-found: error
          retention-days: 3
