name: Build SideStore iOS IPA

on:
  push:
    branches:
      - feat/ios-sidestore
    paths:
      - .github/workflows/ios-sidestore.yml
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner
        type: choice
        options:
          - hosted
          - self-hosted
        default: hosted

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "macos-paseo-ios"]') || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure hosted build tools
        if: inputs.runner != 'self-hosted'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
          brew install ldid
      - name: Configure isolated build tools
        if: inputs.runner == 'self-hosted'
        run: |
          echo "$HOME/paseo-ios-tools/node-v22.23.5-darwin-x64/bin" >> "$GITHUB_PATH"
          echo "$HOME/paseo-ios-tools/ruby-3.3.11/bin" >> "$GITHUB_PATH"
          echo "$HOME/local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        if: inputs.runner != 'self-hosted'
        with:
          node-version: 22
      - name: Check toolchain
        run: |
          node --version
          ruby --version
          pod --version
          xcodebuild -version
          xcrun swift --version
          df -h .
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build unsigned IPA
        run: bash scripts/build-ios-sidestore.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: paseo-ios-sidestore
          path: artifacts/ios-sidestore/
          if-no-files-found: error
          retention-days: 30
